<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>Lector en Coche</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
    <style>
        html, body {
            height: 100%;
            background-color: #121212;
            color: #fff;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            padding: 0.5rem;
            gap: 0.5rem;
        }
        /* Zona de texto: ocupa todo el espacio disponible */
        .texto-scroll {
            flex: 1;
            overflow-y: auto;
            background: #1e1e1e;
            border-radius: 0.75rem;
            padding: 0.75rem;
            font-size: 1.15rem;
            line-height: 1.7;
            user-select: none;
            -webkit-user-select: none;
        }
        .texto-scroll:empty::before {
            content: "Comparte un texto desde otra app o pégalo aquí abajo.";
            color: #666;
            display: block;
            padding: 1rem;
            text-align: center;
        }
        /* Párrafos */
        .parrafo {
            padding: 0.5rem 0.6rem;
            border-radius: 0.5rem;
            margin-bottom: 0.5rem;
            transition: background-color 0.2s ease;
            cursor: pointer;
        }
        .parrafo.activo {
            background-color: #2b4a2b;
            border-left: 4px solid #4caf50;
            font-weight: 500;
        }
        .parrafo:active {
            background-color: #333;
        }
        /* Botones de control */
        .controles {
            flex-shrink: 0;
        }
        .btn-control {
            font-size: 1.6rem;
            padding: 1rem;
            font-weight: bold;
            border-radius: 0.9rem;
        }
        .btn-control-sm {
            font-size: 1.2rem;
            padding: 0.7rem;
            border-radius: 0.7rem;
        }
        .velocidad-display {
            font-size: 1.6rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .textarea-manual {
            background: #1e1e1e;
            color: #fff;
            border: 1px solid #444;
            border-radius: 0.5rem;
            font-size: 1rem;
        }
        .textarea-manual::placeholder {
            color: #666;
        }
        .btn-voz {
            text-align: left;
            font-size: 0.95rem;
        }
        /* Ocultar la lista de voces por defecto para no saturar */
        .lista-voces {
            max-height: 30vh;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div id="app" class="app-container">

        <!-- ===== ZONA DE TEXTO (ocupa todo el espacio) ===== -->
        <div class="texto-scroll" ref="textoScroll" v-if="hayTexto">
            <div v-for="(p, i) in parrafos" :key="i"
                 :class="['parrafo', { activo: i === parrafoActual }]"
                 @click="saltarAParrafo(i)">
                {{ p }}
            </div>
        </div>

        <!-- Si no hay texto compartido, mostrar textarea para pegar -->
        <div class="texto-scroll d-flex flex-column" v-else>
            <p class="text-muted text-center mt-3 mb-2">Comparte un texto desde otra app</p>
            <p class="text-muted text-center small mb-3">o pégalo aquí:</p>
            <textarea v-model="textoManual" class="textarea-manual w-100 flex-grow-0" rows="4"
                      placeholder="Escribe o pega un texto..."></textarea>
            <button v-if="textoManual.trim()" @click="usarTextoManual"
                    class="btn btn-outline-light w-100 mt-2 py-3">
                Usar este texto
            </button>
        </div>

        <!-- ===== CONTROLES (fijos abajo) ===== -->
        <div class="controles d-grid gap-2" v-if="hayTexto">

            <!-- Fila 1: LEER/PAUSA + REINICIAR -->
            <div class="row g-2">
                <div class="col-8">
                    <button @click="toggleLectura"
                            :class="['btn', 'btn-control', 'w-100', estaPausado ? 'btn-warning' : (estaLeyendo ? 'btn-primary' : 'btn-success')]"
                            :disabled="!hayTexto">
                        <span v-if="!estaLeyendo && !estaPausado">▶ LEER</span>
                        <span v-else-if="estaPausado">▶ REANUDAR</span>
                        <span v-else>⏸ PAUSA</span>
                    </button>
                </div>
                <div class="col-4">
                    <button @click="reiniciar" class="btn btn-danger btn-control w-100"
                            :disabled="!hayTexto">
                        🔄
                    </button>
                </div>
            </div>

            <!-- Fila 2: VELOCIDAD -->
            <div class="d-flex gap-2 align-items-stretch">
                <button @click="cambiarVelocidad(-0.25)" class="btn btn-outline-light btn-control-sm flex-fill">−</button>
                <div class="velocidad-display flex-fill">{{ velocidad.toFixed(2) }}×</div>
                <button @click="cambiarVelocidad(0.25)" class="btn btn-outline-light btn-control-sm flex-fill">+</button>
            </div>

            <!-- Fila 3: CAMBIO DE VOZ + IDIOMA -->
            <div class="row g-2">
                <div class="col-7">
                    <button @click="ciclarVoz" class="btn btn-info btn-control-sm w-100 py-3">
                        🎤 CAMBIO DE VOZ
                    </button>
                </div>
                <div class="col-5">
                    <button @click="cambiarIdiomaAutomatico" class="btn btn-warning btn-control-sm w-100 py-3">
                        🌐 IDIOMA
                    </button>
                </div>
            </div>

            <!-- Info de voz actual + idioma detectado -->
            <div class="text-center small text-muted">
                <span v-if="vozActualNombre">{{ vozActualNombre }}</span>
                <span v-if="idiomaDetectado" class="badge bg-info text-dark ms-1">{{ idiomaDetectado }}</span>
            </div>

        </div>

    </div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script>
        const { createApp, nextTick } = Vue;

        createApp({
            data() {
                return {
                    texto: '',
                    textoManual: '',
                    velocidad: 1.0,
                    voces: [],
                    vozSeleccionada: 0,
                    idiomaDetectado: '',

                    // Estado de lectura
                    parrafos: [],           // array de strings (párrafos)
                    parrafoActual: 0,       // índice del párrafo que se está leyendo / resaltado
                    estaLeyendo: false,     // true = hablando (speechSynthesis.speaking)
                    estaPausado: false,     // true = pausado (speechSynthesis.paused)
                    utteranceActual: null,  // referencia a la utterance en curso
                };
            },
            computed: {
                hayTexto() {
                    return this.parrafos.length > 0;
                },
                vozActualNombre() {
                    const v = this.voces[this.vozSeleccionada];
                    return v ? `${v.name} (${v.lang})` : '';
                }
            },
            mounted() {
                // 1. Texto compartido desde la URL
                const params = new URLSearchParams(window.location.search);
                const textoCompartido = params.get('text') || params.get('url') || params.get('title') || '';
                if (textoCompartido) {
                    this.establecerTexto(textoCompartido);
                }

                // 2. Cargar voces
                this.cargarVoces();
                if (typeof speechSynthesis !== 'undefined') {
                    speechSynthesis.onvoiceschanged = this.cargarVoces;
                }

                // 3. Configurar Media Session para controles del coche / bluetooth
                this.configurarMediaSession();

                // 4. Registrar Service Worker
                if ('serviceWorker' in navigator) {
                    navigator.serviceWorker.register('sw.js').catch(err => console.log('SW:', err));
                }
            },
            methods: {
                // ========== TEXTO Y PÁRRAFOS ==========
                establecerTexto(t) {
                    this.texto = t;
                    // Dividir en párrafos por doble salto de línea o saltos simples
                    this.parrafos = t.split(/\n\s*\n|\n/).filter(p => p.trim().length > 0);
                    if (this.parrafos.length === 0 && t.trim()) {
                        this.parrafos = [t.trim()];
                    }
                    this.parrafoActual = 0;
                },
                usarTextoManual() {
                    this.establecerTexto(this.textoManual.trim());
                },

                // ========== VOCES ==========
                cargarVoces() {
                    const todas = speechSynthesis.getVoices();
                    if (!todas.length) return;
                    this.voces = todas;
                    const idxEs = todas.findIndex(v => v.lang.toLowerCase().startsWith('es'));
                    if (idxEs !== -1) this.vozSeleccionada = idxEs;
                },
                ciclarVoz() {
                    if (!this.voces.length) return;
                    this.vozSeleccionada = (this.vozSeleccionada + 1) % this.voces.length;
                },
                cambiarIdiomaAutomatico() {
                    if (!this.voces.length) return;
                    let idioma = this.detectarIdioma(this.texto);
                    if (!idioma) {
                        idioma = (navigator.language || 'es').split('-')[0].toLowerCase();
                    }
                    this.idiomaDetectado = idioma;
                    const coincidencias = [];
                    this.voces.forEach((v, i) => {
                        if (v.lang.toLowerCase().split('-')[0] === idioma) coincidencias.push(i);
                    });
                    if (coincidencias.length === 0) return;
                    const posActual = coincidencias.indexOf(this.vozSeleccionada);
                    const siguientePos = posActual === -1 ? 0 : (posActual + 1) % coincidencias.length;
                    this.vozSeleccionada = coincidencias[siguientePos];
                },
                detectarIdioma(texto) {
                    if (!texto || texto.trim().length < 4) return '';
                    const tiene = (regex) => regex.test(texto);
                    if (tiene(/[\u0400-\u04FF]/)) return 'ru';
                    if (tiene(/[\u0370-\u03FF]/)) return 'el';
                    if (tiene(/[\u0600-\u06FF]/)) return 'ar';
                    if (tiene(/[\u4E00-\u9FFF]/)) return 'zh';
                    if (tiene(/[\u3040-\u30FF]/)) return 'ja';
                    if (tiene(/[\uAC00-\uD7AF]/)) return 'ko';
                    if (tiene(/[ñ¿¡]/i)) return 'es';
                    if (tiene(/[ß]/i)) return 'de';
                    if (tiene(/[çœ]/i)) return 'fr';
                    const t = ' ' + texto.toLowerCase() + ' ';
                    const palabras = {
                        es: [' el ', ' la ', ' de ', ' que ', ' y ', ' los ', ' las ', ' con ', ' para ', ' por ', ' está ', ' pero '],
                        en: [' the ', ' and ', ' of ', ' to ', ' is ', ' that ', ' it ', ' in ', ' you ', ' for ', ' this ', ' with '],
                        fr: [' le ', ' la ', ' les ', ' de ', ' et ', ' est ', ' que ', ' des ', ' un ', ' une ', ' pour ', ' dans '],
                        de: [' der ', ' die ', ' das ', ' und ', ' ist ', ' von ', ' zu ', ' mit ', ' ein ', ' eine ', ' für ', ' auf '],
                        it: [' il ', ' la ', ' di ', ' che ', ' e ', ' un ', ' una ', ' per ', ' con ', ' non ', ' sono ', ' del '],
                        pt: [' o ', ' a ', ' de ', ' que ', ' e ', ' os ', ' as ', ' um ', ' uma ', ' para ', ' com ', ' não ']
                    };
                    const punt = {};
                    for (const [idi, lista] of Object.entries(palabras)) {
                        punt[idi] = 0;
                        for (const p of lista) punt[idi] += (t.split(p).length - 1);
                    }
                    let mejor = '', max = 0;
                    for (const [idi, p] of Object.entries(punt)) {
                        if (p > max) { max = p; mejor = idi; }
                    }
                    return max >= 2 ? mejor : '';
                },

                // ========== LECTURA ==========
                toggleLectura() {
                    if (this.estaPausado) {
                        // Reanudar
                        speechSynthesis.resume();
                        this.estaPausado = false;
                        this.estaLeyendo = true;
                        this.actualizarMediaSession('playing');
                        return;
                    }
                    if (this.estaLeyendo) {
                        // Pausar
                        speechSynthesis.pause();
                        this.estaPausado = true;
                        this.estaLeyendo = false;
                        this.actualizarMediaSession('paused');
                        return;
                    }
                    // Iniciar desde el párrafo actual
                    this.leerDesdeParrafo(this.parrafoActual);
                },
                leerDesdeParrafo(indice) {
                    if (indice < 0 || indice >= this.parrafos.length) return;
                    speechSynthesis.cancel();
                    this.parrafoActual = indice;
                    this.estaLeyendo = true;
                    this.estaPausado = false;
                    this.hablarParrafo(indice);
                },
                hablarParrafo(indice) {
                    if (indice >= this.parrafos.length) {
                        // Fin de la lectura
                        this.estaLeyendo = false;
                        this.estaPausado = false;
                        this.actualizarMediaSession('none');
                        return;
                    }
                    const texto = this.parrafos[indice];
                    const u = new SpeechSynthesisUtterance(texto);
                    u.rate = this.velocidad;
                    if (this.voces[this.vozSeleccionada]) {
                        u.voice = this.voces[this.vozSeleccionada];
                        u.lang = u.voice.lang;
                    }

                    u.onstart = () => {
                        this.parrafoActual = indice;
                        this.estaLeyendo = true;
                        this.estaPausado = false;
                        this.actualizarMediaSession('playing');
                    };

                    u.onend = () => {
                        // Pasar automáticamente al siguiente párrafo
                        // (solo si no se ha cancelado manualmente)
                        if (this.estaLeyendo || this.estaPausado) {
                            this.hablarParrafo(indice + 1);
                        }
                    };

                    u.onerror = (e) => {
                        if (e.error !== 'interrupted' && e.error !== 'canceled') {
                            console.error('Error TTS:', e);
                            this.estaLeyendo = false;
                            this.estaPausado = false;
                        }
                    };

                    this.utteranceActual = u;
                    speechSynthesis.speak(u);
                },
                reiniciar() {
                    speechSynthesis.cancel();
                    this.estaLeyendo = false;
                    this.estaPausado = false;
                    this.parrafoActual = 0;
                    this.actualizarMediaSession('none');
                },
                saltarAParrafo(indice) {
                    // Si ya está leyendo o pausado, saltar y continuar
                    if (this.estaLeyendo || this.estaPausado) {
                        this.leerDesdeParrafo(indice);
                    } else {
                        // Solo resaltar
                        this.parrafoActual = indice;
                    }
                },

                // ========== VELOCIDAD ==========
                cambiarVelocidad(cambio) {
                    let nueva = this.velocidad + cambio;
                    if (nueva < 0.5) nueva = 0.5;
                    if (nueva > 2.0) nueva = 2.0;
                    this.velocidad = Math.round(nueva * 100) / 100;

                    // Si está leyendo, reiniciar el párrafo actual con la nueva velocidad
                    if (this.estaLeyendo && !this.estaPausado) {
                        const idx = this.parrafoActual;
                        speechSynthesis.cancel();
                        // Pequeño delay para que el cancel se procese
                        setTimeout(() => this.hablarParrafo(idx), 50);
                    }
                },

                // ========== MEDIA SESSION (controles del coche / bluetooth) ==========
                configurarMediaSession() {
                    if (!('mediaSession' in navigator)) {
                        console.log('Media Session API no disponible');
                        return;
                    }

                    // Metadata básica (para mostrar en pantalla del coche)
                    navigator.mediaSession.metadata = new MediaMetadata({
                        title: 'Lector en Coche',
                        artist: 'Text to Speech',
                        album: ''
                    });

                    // Handler: Play / Pausa (toggle)
                    navigator.mediaSession.setActionHandler('play', () => {
                        if (this.estaPausado) {
                            this.toggleLectura();
                        } else if (!this.estaLeyendo) {
                            this.leerDesdeParrafo(this.parrafoActual);
                        }
                    });

                    navigator.mediaSession.setActionHandler('pause', () => {
                        if (this.estaLeyendo) this.toggleLectura();
                    });

                    // Handler: Párrafo anterior
                    navigator.mediaSession.setActionHandler('previoustrack', () => {
                        const nuevo = Math.max(0, this.parrafoActual - 1);
                        this.leerDesdeParrafo(nuevo);
                    });

                    // Handler: Párrafo siguiente
                    navigator.mediaSession.setActionHandler('nexttrack', () => {
                        const nuevo = Math.min(this.parrafos.length - 1, this.parrafoActual + 1);
                        this.leerDesdeParrafo(nuevo);
                    });

                    // Handler: Stop (detener y volver al inicio)
                    navigator.mediaSession.setActionHandler('stop', () => {
                        this.reiniciar();
                    });
                },
                actualizarMediaSession(estado) {
                    if ('mediaSession' in navigator) {
                        navigator.mediaSession.playbackState = estado;
                    }
                }
            }
        }).mount('#app');
    </script>
</body>
</html>

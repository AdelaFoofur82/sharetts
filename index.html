<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>Lector en Coche</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
    <style>
        body {
            background-color: #121212;
            color: #fff;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        .btn-gigante {
            font-size: 2rem;
            padding: 1.5rem;
            font-weight: bold;
            border-radius: 1rem;
        }
        .texto-compartido {
            background: #1e1e1e;
            border-radius: 0.75rem;
            padding: 1rem;
            max-height: 120px;
            overflow-y: auto;
            font-size: 1rem;
            color: #ccc;
        }
        .velocidad-display {
            font-size: 2rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-voz {
            text-align: left;
            font-size: 1rem;
        }
        .sin-texto {
            text-align: center;
            padding: 2rem 1rem;
            color: #888;
        }
    </style>
</head>
<body>
    <div id="app" class="container-fluid py-3" style="padding-bottom: 2rem;">

        <!-- Texto compartido -->
        <div v-if="texto" class="texto-compartido mb-3">
            {{ texto }}
        </div>
        <div v-else class="sin-texto mb-3">
            <p>Comparte un texto desde otra app para empezar.</p>
            <p class="small">O pega algo aquí:</p>
            <textarea v-model="textoManual" class="form-control bg-dark text-white border-secondary" rows="3" placeholder="Escribe o pega un texto..."></textarea>
            <button v-if="textoManual" @click="usarTextoManual" class="btn btn-outline-light mt-2 w-100">Usar este texto</button>
        </div>

        <!-- Botón LEER -->
        <button @click="leer" class="btn btn-success btn-gigante w-100 mb-3" :disabled="!texto">
            ▶ LEER
        </button>

        <!-- Botón PARAR -->
        <button @click="parar" class="btn btn-danger btn-gigante w-100 mb-4">
            ⏹ PARAR
        </button>

        <!-- Botón CAMBIAR IDIOMA (nuevo) -->
        <button @click="cambiarIdiomaAutomatico" class="btn btn-warning btn-gigante w-100 mb-4">
            🌐 CAMBIAR IDIOMA
        </button>

        <!-- Velocidad -->
        <div class="mb-4">
            <label class="form-label fs-5 fw-bold">Velocidad</label>
            <div class="d-flex gap-2 align-items-stretch">
                <button @click="cambiarVelocidad(-0.25)" class="btn btn-outline-light flex-fill py-4 fs-3">−</button>
                <div class="velocidad-display flex-fill">{{ velocidad.toFixed(2) }}×</div>
                <button @click="cambiarVelocidad(0.25)" class="btn btn-outline-light flex-fill py-4 fs-3">+</button>
            </div>
        </div>

        <!-- Info idioma detectado -->
        <div v-if="idiomaDetectado" class="mb-3 text-center">
            <span class="badge bg-info text-dark fs-6">
                Idioma detectado: {{ idiomaDetectado }}
            </span>
        </div>

        <!-- Voces -->
        <div class="mb-3">
            <label class="form-label fs-5 fw-bold">Voz ({{ voces.length }})</label>
            <div class="d-grid gap-2">
                <button v-for="(voz, i) in voces" :key="voz.name + i"
                        @click="seleccionarVoz(i)"
                        :class="['btn', 'btn-voz', 'py-3', vozSeleccionada === i ? 'btn-primary' : 'btn-outline-secondary']">
                    🔊 {{ voz.name }} <span class="badge bg-secondary">{{ voz.lang }}</span>
                </button>
                <p v-if="voces.length === 0" class="text-muted small">Cargando voces...</p>
            </div>
        </div>

    </div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script>
        const { createApp } = Vue;

        createApp({
            data() {
                return {
                    texto: '',
                    textoManual: '',
                    velocidad: 1.0,
                    voces: [],
                    vozSeleccionada: 0,
                    idiomaDetectado: ''
                };
            },
            mounted() {
                const params = new URLSearchParams(window.location.search);
                this.texto = params.get('text') || params.get('url') || params.get('title') || '';

                this.cargarVoces();
                if (typeof speechSynthesis !== 'undefined') {
                    speechSynthesis.onvoiceschanged = this.cargarVoces;
                }

                if ('serviceWorker' in navigator) {
                    navigator.serviceWorker.register('sw.js').catch(err => console.log('SW:', err));
                }
            },
            methods: {
                cargarVoces() {
                    const todas = speechSynthesis.getVoices();
                    if (!todas.length) return;
                    this.voces = todas;
                    const idxEs = todas.findIndex(v => v.lang.toLowerCase().startsWith('es'));
                    if (idxEs !== -1) this.vozSeleccionada = idxEs;
                },
                usarTextoManual() {
                    this.texto = this.textoManual;
                },
                cambiarVelocidad(cambio) {
                    let nueva = this.velocidad + cambio;
                    if (nueva < 0.5) nueva = 0.5;
                    if (nueva > 2.0) nueva = 2.0;
                    this.velocidad = Math.round(nueva * 100) / 100;
                },
                seleccionarVoz(index) {
                    this.vozSeleccionada = index;
                },
                /**
                 * Cambia a la siguiente voz disponible del idioma detectado.
                 * - Detecta el idioma del texto con `SpeechSynthesisUtterance.lang`
                 *   (el navegador hace la detección automática si no se especifica).
                 * - Si no se detecta, usa el idioma del cliente (navigator.language).
                 * - Salta a la SIGUIENTE voz de ese idioma (rotación entre voces).
                 */
                cambiarIdiomaAutomatico() {
                    if (!this.voces.length) return;

                    // 1. Detectar idioma del texto
                    let idioma = this.detectarIdioma(this.texto);

                    // 2. Si no se ha detectado, usar idioma del cliente
                    if (!idioma) {
                        idioma = (navigator.language || 'es').split('-')[0].toLowerCase();
                    }
                    this.idiomaDetectado = idioma;

                    // 3. Buscar todas las voces que coincidan con ese idioma
                    const coincidencias = [];
                    this.voces.forEach((v, i) => {
                        const langVoz = v.lang.toLowerCase().split('-')[0];
                        if (langVoz === idioma) coincidencias.push(i);
                    });

                    // 4. Si no hay voces para ese idioma, avisar
                    if (coincidencias.length === 0) {
                        console.warn('No hay voces para el idioma:', idioma);
                        // Fallback: buscar cualquier voz que contenga el idioma
                        const alt = this.voces.findIndex(v => v.lang.toLowerCase().includes(idioma));
                        if (alt !== -1) {
                            this.vozSeleccionada = alt;
                        }
                        return;
                    }

                    // 5. Rotar a la SIGUIENTE voz de ese idioma
                    const posActual = coincidencias.indexOf(this.vozSeleccionada);
                    let siguientePos;
                    if (posActual === -1) {
                        // No estábamos en ese idioma: ir a la primera
                        siguientePos = 0;
                    } else {
                        // Estábamos en ese idioma: rotar
                        siguientePos = (posActual + 1) % coincidencias.length;
                    }
                    this.vozSeleccionada = coincidencias[siguientePos];
                },

                /**
                 * Detección de idioma simple por frecuencias de caracteres.
                 * Devuelve el código ISO 639-1 (ej: "es", "en", "fr") o "" si no detecta.
                 */
                detectarIdioma(texto) {
                    if (!texto || texto.trim().length < 4) return '';

                    // Heurística 1: caracteres específicos por idioma
                    const tiene = (regex) => regex.test(texto);

                    // Cirílico → ruso
                    if (tiene(/[\u0400-\u04FF]/)) return 'ru';
                    // Griego
                    if (tiene(/[\u0370-\u03FF]/)) return 'el';
                    // Árabe
                    if (tiene(/[\u0600-\u06FF]/)) return 'ar';
                    // Hebreo
                    if (tiene(/[\u0590-\u05FF]/)) return 'he';
                    // Chino
                    if (tiene(/[\u4E00-\u9FFF]/)) return 'zh';
                    // Japonés (hiragana/katakana)
                    if (tiene(/[\u3040-\u30FF]/)) return 'ja';
                    // Coreano
                    if (tiene(/[\uAC00-\uD7AF]/)) return 'ko';
                    // Tailandés
                    if (tiene(/[\u0E00-\u0E7F]/)) return 'th';

                    // Heurística 2: caracteres especiales latinos
                    // Español: ñ, ¿, ¡, á é í ó ú
                    if (tiene(/[ñ¿¡]/i)) return 'es';
                    // Alemán: ß, ä, ö, ü
                    if (tiene(/[ß]/i)) return 'de';
                    // Francés: ç, œ, à è ù
                    if (tiene(/[çœàèù]/i)) return 'fr';
                    // Portugués: ã, õ, ç
                    if (tiene(/[ãõ]/i)) return 'pt';
                    // Italiano: à è ì ò ù (comparte con otros, mejor no forzar)

                    // Heurística 3: palabras muy comunes
                    const t = ' ' + texto.toLowerCase() + ' ';
                    const puntuaciones = {
                        es: 0, en: 0, fr: 0, de: 0, it: 0, pt: 0
                    };

                    const palabrasClave = {
                        es: [' el ', ' la ', ' de ', ' que ', ' y ', ' los ', ' las ', ' con ', ' para ', ' por ', ' está ', ' pero ', ' como ', ' más ', ' este ', ' esta '],
                        en: [' the ', ' and ', ' of ', ' to ', ' is ', ' that ', ' it ', ' in ', ' you ', ' for ', ' this ', ' with ', ' are ', ' was ', ' be '],
                        fr: [' le ', ' la ', ' les ', ' de ', ' et ', ' est ', ' que ', ' des ', ' un ', ' une ', ' pour ', ' dans ', ' avec ', ' ce ', ' sont '],
                        de: [' der ', ' die ', ' das ', ' und ', ' ist ', ' von ', ' zu ', ' mit ', ' ein ', ' eine ', ' für ', ' auf ', ' nicht ', ' sind ', ' dem '],
                        it: [' il ', ' la ', ' di ', ' che ', ' e ', ' un ', ' una ', ' per ', ' con ', ' non ', ' sono ', ' del ', ' della ', ' gli ', ' nel '],
                        pt: [' o ', ' a ', ' de ', ' que ', ' e ', ' os ', ' as ', ' um ', ' uma ', ' para ', ' com ', ' não ', ' são ', ' do ', ' da ']
                    };

                    for (const [idioma, palabras] of Object.entries(palabrasClave)) {
                        for (const p of palabras) {
                            const ocurrencias = (t.split(p).length - 1);
                            puntuaciones[idioma] += ocurrencias;
                        }
                    }

                    // Encontrar el máximo
                    let mejorIdioma = '';
                    let mejorPuntuacion = 0;
                    for (const [idioma, pun] of Object.entries(puntuaciones)) {
                        if (pun > mejorPuntuacion) {
                            mejorPuntuacion = pun;
                            mejorIdioma = idioma;
                        }
                    }

                    // Umbral mínimo: si no hay al menos 2 coincidencias, no confiar
                    if (mejorPuntuacion >= 2) return mejorIdioma;

                    return '';
                },

                leer() {
                    if (!this.texto) return;
                    speechSynthesis.cancel();

                    const u = new SpeechSynthesisUtterance(this.texto);
                    u.rate = this.velocidad;

                    if (this.voces[this.vozSeleccionada]) {
                        u.voice = this.voces[this.vozSeleccionada];
                        u.lang = u.voice.lang;
                    }

                    u.onend = () => console.log('Lectura terminada');
                    u.onerror = (e) => console.error('Error TTS:', e);

                    speechSynthesis.speak(u);
                },
                parar() {
                    speechSynthesis.cancel();
                }
            }
        }).mount('#app');
    </script>
</body>
</html>
